<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Service</title>
    <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
    >
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <section class="weather-panel" aria-labelledby="page-heading">
            <h1 id="page-heading">Weather Service</h1>

            <p class="intro">
                We'll fetch the weather for you!
                Where do you want to know the weather?
            </p>

            <div class="search-controls">
                <button type="button" id="location-button">
                    My location!
                </button>

                <form id="search-form">
                    <label class="visually-hidden" for="city-input">
                        Enter city
                    </label>
                    <input
                        type="text"
                        id="city-input"
                        name="city"
                        placeholder="Enter city here..."
                        required
                    >
                </form>
            </div>

            <p id="status-message" role="status"></p>
            <section id="weather-result" aria-label="Current weather" hidden>
                <img
                    id="weather-icon"
                    src="https://openweathermap.org/img/wn/01d@2x.png"
                    alt=""
                    width="100"
                    height="100"
                >
            
                <h2 id="weather-city"></h2>
            
                <p>
                    <span class="visually-hidden">Temperature:</span>
                    <span id="weather-temperature"></span> °C
                </p>
            
                <p>
                    <span class="visually-hidden">Wind speed:</span>
                    <span id="weather-wind"></span> m/s
                </p>
            </section>
        </section>
    </main>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="config.js"></script>
    <script src="script.js"></script>
</body>
</html>
